[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mygeocode"
version = "1.1.1"
description = "Official Python client for the My Geocode API: geocoding, reverse geocoding, address autocomplete, IP, timezone, elevation and postal code lookups."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.6"
authors = [{ name = "My Geocode", email = "support@mygeocode.com" }]
keywords = ["geocoding", "geocode", "reverse-geocoding", "autocomplete", "ip-geolocation", "timezone", "elevation", "postcode", "mygeocode"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Framework :: AsyncIO",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://www.mygeocode.com/sdks/"
Documentation = "https://www.mygeocode.com/docs/"
Repository = "https://github.com/mygeocode/mygeocode-python"
Issues = "https://github.com/mygeocode/mygeocode-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mygeocode"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]

[tool.mypy]
strict = true
python_version = "3.10"
